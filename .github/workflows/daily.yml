name: 毎朝の予測ページを更新

on:
  schedule:
    # 2026-10 から公開の主役は Mac（scripts/publish_from_mac.sh、平日 7:30/8:30/16:30 JST）。
    # GitHub の定時実行は混雑で数時間遅れ、寄付き後（10〜12 時台）になることが多かったため。
    # ここは Mac が止まっていた日の予備として 1 日 1 回だけ動かす（10:30 JST）。
    # 寄付き前に Mac が出した予想は上書きされない（build_page.append_today）。
    - cron: "30 1 * * 1-5"
  workflow_dispatch:        # 手動実行用のボタン

permissions:
  contents: write

concurrency:
  group: daily-page
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: 依存関係をインストール
        run: pip install -r requirements.txt

      - name: 予測ページを生成
        run: python scripts/build_page.py --outdir docs

      - name: 変更をコミット
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          # holdings.json も残す。月次データなので毎朝取りに行かずに済む
          git add docs/index.html docs/summary.json docs/history.json docs/holdings.json docs/.nojekyll
          if git diff --staged --quiet; then
            echo "変更なし"
          else
            git commit -m "update: $(date -u +%Y-%m-%d) の予測（予備）"
            git pull --rebase origin main
            git push
          fi
