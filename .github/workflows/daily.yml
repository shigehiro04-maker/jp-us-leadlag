name: 毎朝の予測ページを更新

on:
  schedule:
    # 22:00 UTC = 翌 07:00 JST。日〜木(UTC) に動かすと 月〜金(JST) の朝になる。
    # GitHub の無料枠では実行が 5〜20 分ほど遅れることがある。
    - cron: "0 22 * * 0-4"
  workflow_dispatch:        # 手動実行用のボタン

permissions:
  contents: write

concurrency:
  group: daily-page
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: 依存関係をインストール
        run: pip install -r requirements.txt

      - name: 予測ページを生成
        run: |
          set -o pipefail
          python scripts/build_page.py --outdir docs 2>&1 | tee /tmp/gen.log

      - name: 失敗したログを残す（デバッグ用・後で削除）
        if: failure()
        run: |
          mkdir -p debug
          tail -c 40000 /tmp/gen.log > debug/last_error.log || echo "ログなし" > debug/last_error.log
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -f debug/last_error.log
          git commit -m "debug: 失敗ログ" || true
          git push || true

      - name: 変更をコミット
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/index.html docs/history.json docs/.nojekyll
          if git diff --staged --quiet; then
            echo "変更なし"
          else
            git commit -m "update: $(date -u +%Y-%m-%d) の予測"
            git push
          fi
