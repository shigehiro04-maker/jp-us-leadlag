name: 毎朝の予測ページを更新

on:
  schedule:
    # 2026-10 から公開の主役は Mac（scripts/publish_from_mac.sh、平日 7:30/8:30/16:30 JST）。
    # GitHub の定時実行は混雑で数時間遅れ、寄付き後（10〜12 時台）になることが多かったため。
    # ここは Mac が止まっていた日の予備として 1 日 1 回だけ動かす（10:30 JST）。
    # 寄付き前に Mac が出した予想は上書きされない（build_page.append_today）。
    - cron: "30 1 * * 1-5"
  workflow_dispatch:        # 手動実行用のボタン

permissions:
  contents: write

concurrency:
  group: daily-page
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - uses: actions/checkout@v4

      - name: Mac が今朝すでに公開していれば何もしない
        id: fresh
        run: |
          python - <<'PY'
          import json, os, datetime
          today = (datetime.datetime.utcnow() + datetime.timedelta(hours=9)).strftime("%Y-%m-%d")
          try:
              h = json.load(open("docs/history.json"))
          except Exception:
              h = []
          fresh = any(str(r.get("created_at", "")).startswith(today) for r in h)
          print("Mac の公開あり" if fresh else "Mac の公開なし → 予備で作成")
          with open(os.environ["GITHUB_OUTPUT"], "a") as f:
              f.write(f"skip={'true' if fresh else 'false'}\n")
          PY

      - uses: actions/setup-python@v5
        if: steps.fresh.outputs.skip != 'true'
        with:
          python-version: "3.12"
          cache: pip

      - name: 依存関係をインストール
        if: steps.fresh.outputs.skip != 'true'
        run: pip install -r requirements.txt

      - name: 予測ページを生成
        if: steps.fresh.outputs.skip != 'true'
        run: python scripts/build_page.py --outdir docs

      - name: 変更をコミット
        if: steps.fresh.outputs.skip != 'true'
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          # holdings.json も残す。月次データなので毎朝取りに行かずに済む
          git add docs/index.html docs/summary.json docs/history.json docs/holdings.json docs/.nojekyll
          if git diff --staged --quiet; then
            echo "変更なし"
          else
            git commit -m "update: $(date -u +%Y-%m-%d) の予測（予備）"
            # Mac 側が先に公開していたら、予備の公開は見送る（生成物どうしの競合を作らない）
            git push || echo "Mac 側が先に公開したため、予備の公開は見送りました"
          fi
