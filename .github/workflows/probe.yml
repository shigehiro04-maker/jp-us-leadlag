name: 診断（一時的）

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt
      - run: python scripts/probe_holdings.py 2>&1 | tail -5
      - name: 結果をコミット
        if: always()
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -f debug/holdings_probe.txt || true
          git commit -m "probe: 組入銘柄ファイルの構造" || true
          git pull --rebase -q || true
          git push || true
